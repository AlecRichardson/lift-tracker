<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Lift Tracker</title>

  <meta name="theme-color" content="#101112" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lift Tracker" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="topbarTitleWrap">
      <h2 id="pageTitle">Lift Tracker</h2>
      <p id="pageSubtitle"></p>
    </div>
    <button id="accountBtn" type="button" class="accountBtn hidden" aria-haspopup="dialog">Account</button>
  </header>

  <main class="appShell">
    <div id="appMessage" class="appMessage hidden" role="status" aria-live="polite"></div>
    <section id="homePage" class="page">
      <div class="homeHero">
        <img src="icon-192.png" width="40" height="40" alt="" />
        <div>
          <p class="eyebrow">Active Plan</p>
          <h3 id="activePlanName">Loading...</h3>
          <p id="activePlanMeta">Checking your workouts...</p>
        </div>
      </div>

      <section id="resumeWorkoutCard" class="dashboardCard hidden"></section>
      <section id="todayWorkoutCard" class="dashboardCard"></section>

      <section id="homeWorkoutsSection" class="dashboardCard">
        <div class="cardHeaderRow">
          <div>
            <p class="eyebrow">All Workouts</p>
            <h3>Choose a workout</h3>
          </div>
        </div>
        <div id="allWorkoutsGrid" class="workoutButtonGrid"></div>
      </section>

      <section id="recentWorkoutCard" class="dashboardCard"></section>

      <section id="homeProgressCard" class="dashboardCard"></section>

      <section id="homePlanCard" class="dashboardCard"></section>
    </section>

    <section id="workoutPage" class="page hidden">
      <div class="workoutContextBar">
        <label class="gymSelectorPill" for="gymSelect">
          <span>Gym</span>
          <select id="gymSelect"></select>
        </label>
        <button id="addGymBtn" type="button" class="gymAddBtn" aria-label="Add gym" title="Add gym">+</button>
        <button id="discardWorkout" type="button" class="gymAddBtn" aria-label="Discard unfinished workout" title="Discard unfinished workout">&times;</button>
      </div>

      <div id="exerciseContainer"></div>

      <div class="saveDock">
        <div>
          <p id="workoutCompletion" class="workoutCompletion" aria-live="polite"></p>
          <button id="saveWorkout" type="button" class="primaryBtn">Save Workout</button>
        </div>
        <div id="saveAnimation" class="saveAnimation hidden" role="status">Saved</div>
      </div>
    </section>

    <section id="progressPage" class="page hidden">
      <div class="progressFields">
      <div class="progressField"><label class="fieldLabel" for="exerciseSelect">Exercise</label>
      <select id="exerciseSelect"></select>
      </div>
      <div class="progressField"><label class="fieldLabel" for="progressGymSelect">Gym</label>
      <select id="progressGymSelect"><option value="">All gyms</option></select></div>
      <div class="progressField"><label class="fieldLabel" for="metricSelect">Metric</label>
      <select id="metricSelect">
        <option value="est1rm">Estimated 1RM</option>
        <option value="volume">Total Volume</option>
        <option value="topWeight">Top Working Weight</option>
        <option value="bestSetVolume">Best Set Volume</option>
        <option value="avgWeight">Average Weight</option>
      </select>
      </div></div>
      <div id="progressOverview" class="progressOverview"></div>
      <div class="chartCard">
        <canvas id="chart" role="img" aria-label="Exercise progress chart"></canvas>
        <p id="chartEmpty" class="chartEmpty hidden" role="status"></p>
      </div>
    </section>

    <section id="historyPage" class="page hidden">
      <div id="historyList"></div>
    </section>

    <section id="planPage" class="page hidden">
      <div id="planOverview"></div>
    </section>
  </main>

  <input id="planFileInput" type="file" accept=".json,application/json" hidden />
  <dialog id="planImportDialog" class="accountDialog" aria-labelledby="planImportTitle">
    <h3 id="planImportTitle">Import Plan</h3>
    <p id="planImportName" class="planImportName"></p>
    <div id="planImportDays" class="planImportDays"></div>
    <p id="planImportError" class="builderStatus" role="alert"></p>
    <div class="accountActions">
      <button id="confirmPlanImport" type="button" class="primaryBtn">Save as New Plan</button>
      <button id="cancelPlanImport" type="button" class="secondaryBtn">Cancel</button>
    </div>
  </dialog>
  <dialog id="accountDialog" class="accountDialog" aria-labelledby="accountDialogTitle">
    <div class="accountDialogHeader">
      <div><h3 id="accountDialogTitle">Account</h3><p id="accountName"></p></div>
      <button id="closeAccountDialog" type="button" aria-label="Close account" title="Close">&times;</button>
    </div>
    <p id="accountEmail" class="accountEmail"></p>
    <div class="accountActions">
      <button id="accountExportBtn" type="button" class="secondaryBtn">Export All Workouts</button>
      <details id="accountInstallHelp"><summary>Add to Home Screen</summary><p class="accountEmail">On iPhone, open this site in Safari, tap Share, then Add to Home Screen.</p></details>
      <button id="signOutBtn" type="button" class="dangerBtn">Sign Out</button>
    </div>
  </dialog>

  <nav class="bottomNav" aria-label="Main navigation">
    <button id="bottomHome" type="button" class="bottomNavBtn active" data-page="homePage">
      <span>⌂</span>
      Home
    </button>

    <button id="bottomWorkout" type="button" class="bottomNavBtn" data-page="workoutPage">
      <span>▣</span>
      Workout
    </button>

    <button id="bottomHistory" type="button" class="bottomNavBtn" data-page="historyPage">
      <span>◷</span>
      History
    </button>

    <button id="bottomPlan" type="button" class="bottomNavBtn" data-page="planPage">
      <span>⚙</span>
      Plan
    </button>
  </nav>

  <script src="workouts.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
